# Banco Postgres local, só para desenvolvimento.
# Uso:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - chat-db:/var/lib/postgresql/data
volumes:
  chat-db:
